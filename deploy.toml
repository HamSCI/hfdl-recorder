[package]
name             = "hfdl-recorder"
version          = "0.1.0"
contract_version = "0.8"
license          = "MIT"

# Configuration interview (CONTRACT-v0.5 §14).  Sigmond invokes
# hfdl-recorder's own argparse subcommands; both honor the §14.3 env
# var bag (STATION_*, SIGMOND_INSTANCE, SIGMOND_RADIOD_STATUS) as
# defaults.  station_id is composed from STATION_CALL plus a
# numeric suffix derived from SIGMOND_INSTANCE for airframes.io
# registration uniqueness.
[contract.config]
init = ["/usr/local/bin/hfdl-recorder", "config", "init"]
edit = ["/usr/local/bin/hfdl-recorder", "config", "edit"]

[build]
steps = [
    "python3 -m venv /opt/git/sigmond/hfdl-recorder/venv",
    "/opt/git/sigmond/hfdl-recorder/venv/bin/pip install --upgrade pip setuptools wheel",
    # pip ignores [tool.uv.sources]: the two siblings go in first, from
    # their checkouts (hamsci-dsp is not on PyPI), so the editable install
    # below finds them satisfied.
    "/opt/git/sigmond/hfdl-recorder/venv/bin/pip install -e /opt/git/sigmond/hamsci-dsp",
    "/opt/git/sigmond/hfdl-recorder/venv/bin/pip install -e /opt/git/sigmond/ka9q-python",
    "/opt/git/sigmond/hfdl-recorder/venv/bin/pip install -e /opt/git/sigmond/hfdl-recorder",
    "/opt/git/sigmond/hfdl-recorder/scripts/build-dumphfdl.sh",
]
produces = [
    "/opt/git/sigmond/hfdl-recorder/venv/bin/hfdl-recorder",
    "/opt/git/sigmond/hfdl-recorder/bin/dumphfdl",
]

[[install.steps]]
kind = "link"
src  = "/opt/git/sigmond/hfdl-recorder/venv/bin/hfdl-recorder"
dst  = "/usr/local/bin/hfdl-recorder"

[[install.steps]]
kind = "link"
src  = "systemd/hfdl-recorder@.service"
dst  = "/etc/systemd/system/hfdl-recorder@.service"

[[install.steps]]
kind = "link"
src  = "systemd/hfdl-recorder-squitters@.service"
dst  = "/etc/systemd/system/hfdl-recorder-squitters@.service"

[[install.steps]]
kind = "link"
src  = "systemd/hfdl-recorder-squitters@.timer"
dst  = "/etc/systemd/system/hfdl-recorder-squitters@.timer"

[[install.steps]]
kind     = "render"
src      = "config/hfdl-recorder-config.toml.template"
dst      = "/etc/hfdl-recorder/hfdl-recorder-config.toml"
if_absent = true

[[install.steps]]
kind = "mkdir"
dst  = "/var/lib/hfdl-recorder"
owner = "hfdlrec:hfdlrec"
mode  = "0755"

[[install.steps]]
kind = "mkdir"
dst  = "/var/log/hfdl-recorder"
owner = "hfdlrec:hfdlrec"
mode  = "0755"

[systemd]
units = []
templated_units = ["hfdl-recorder@.service", "hfdl-recorder-squitters@.timer"]
# One instance per radiod named in hfdl-recorder-config.toml's [[radiod]] blocks
# (placeholder skipped); sigmond starts hfdl-recorder@<radiod> and its squitter
# timer.  Every sigmond station sends squitter timing to sigmondb (2026-11-12):
# config init under sigmond turns [timing_squitters] on.  With it off the batch
# finds no windows and exits, so the timer costs nothing.
instances_from = "config-radiods"

# sigmondb rows -> wd30 in their own tars, never a spot tar.  sigmond renders this
# only for an hs-uploader that offers "sigmondb-tar".
[[hs_uploader.pipeline]]
name = "hfdl-sigmondb-arrival"
requires_features = ["sigmondb-tar"]
batch_limit = 5000
[hs_uploader.pipeline.source]
type = "sqlite"
database = "sigmondb"
table = "arrival"
accepted_schema_versions = [1]
producer = "hfdl-recorder"          # no start_at: the rows are new; ship from the first
[hs_uploader.pipeline.transport]
type = "wsprdaemon_tar"
name = "wsprdaemon-tar-sftp:sigmondb-arrival"
servers = ["gw1.wsprdaemon.org", "gw2.wsprdaemon.org"]
version = "4.0"
receiver = "{call_pathsafe}"
compression = "bz2"
tar_root = "wsprdaemon"
primary_table_name = "sigmondb.arrival"
tar_tag = "chirp-arrival"
[hs_uploader.pipeline.transport.ftp_fallback]
servers = ["gw2.wsprdaemon.org"]
ftp_user = "noisegraphs"
remote_path = "upload"
[hs_uploader.pipeline.retry]
base = 2.0
cap_sec = 900.0

[[hs_uploader.pipeline]]
name = "hfdl-sigmondb-capture"
requires_features = ["sigmondb-tar"]
batch_limit = 5000
[hs_uploader.pipeline.source]
type = "sqlite"
database = "sigmondb"
table = "capture"
accepted_schema_versions = [1]
producer = "hfdl-recorder"          # no start_at: the rows are new; ship from the first
[hs_uploader.pipeline.transport]
type = "wsprdaemon_tar"
name = "wsprdaemon-tar-sftp:sigmondb-capture"
servers = ["gw1.wsprdaemon.org", "gw2.wsprdaemon.org"]
version = "4.0"
receiver = "{call_pathsafe}"
compression = "bz2"
tar_root = "wsprdaemon"
primary_table_name = "sigmondb.capture"
tar_tag = "chirp-capture"
[hs_uploader.pipeline.transport.ftp_fallback]
servers = ["gw2.wsprdaemon.org"]
ftp_user = "noisegraphs"
remote_path = "upload"
[hs_uploader.pipeline.retry]
base = 2.0
cap_sec = 900.0

# CONTRACT v0.6 §17 — local sink for `hfdl.spots`.  An in-process
# tailer thread parses the JSON-per-line file dumphfdl writes at
# `/var/lib/hfdl-recorder/<radiod_id>/<band>.json` and stages parsed
# rows into sigmond's local SQLite sink (drained upstream by
# hs-uploader).  dumphfdl's optional airframes.io TCP feed (via its
# own --output spec) is unaffected — the tailer reads the local file,
# not the TCP socket.

[deps]
[[deps.binary]]
name = "dumphfdl"
note = "Built from source by scripts/build-dumphfdl.sh into /opt/git/sigmond/hfdl-recorder/bin/"

[[deps.git]]
name = "ka9q-radio"
url  = "https://github.com/ka9q/ka9q-radio.git"
note = "provides radiod IQ multicast; HFDL fragment in config/fragments/hfdl.conf"

[[deps.pypi]]
name    = "ka9q-python"
version = ">=3.22.0"      # StreamQuality.delivered_rtp_start (the window keeper)
venv    = "/opt/git/sigmond/hfdl-recorder/venv"

[[deps.pypi]]
name    = "hamsci-dsp"
version = ">=0.8.0"       # sibling checkout /opt/git/sigmond/hamsci-dsp, not PyPI
venv    = "/opt/git/sigmond/hfdl-recorder/venv"

# ---------------------------------------------------------------------------
# Sigmond UI hooks (drop-in registration for `smd watch` + TUI Activity).
# Consumed by lib/sigmond/client_features.py.
# ---------------------------------------------------------------------------

[client_features.watch]
verb         = "hfdl"
description  = "HFDL per-band frame counts + GS/aircraft"
verbose      = true
per_instance = true

[client_features.receiver_channels]
description  = "HFDL per-band wide IQ channels (one per enabled HFDL<N>)"
per_instance = true
parser_file  = "src/hfdl_recorder/sigmond_tui.py"
parser_attr  = "parse_receiver_channels"
